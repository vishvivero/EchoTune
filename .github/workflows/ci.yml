name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Tests (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project EchoTune.xcodeproj \
            -scheme EchoTune

      - name: Build (Debug, no signing)
        run: |
          xcodebuild build \
            -project EchoTune.xcodeproj \
            -scheme EchoTune \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Unit Tests (no signing)
        run: |
          xcodebuild test \
            -project EchoTune.xcodeproj \
            -scheme EchoTune \
            -destination 'platform=macOS' \
            -only-testing:EchoTuneTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
