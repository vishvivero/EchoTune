name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Tests (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The project file is in a newer format than some pinned runner images, so
      # always select the newest Xcode the image actually ships.
      - name: Select newest available Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project EchoTune.xcodeproj \
            -scheme EchoTune

      # EchoTune/Resources/CompiledModels is a required build resource but is
      # intentionally gitignored (it holds locally compiled CoreML models), so
      # CI has to provide the directory for the resource copy phase.
      - name: Provide required build resource directory
        run: mkdir -p EchoTune/Resources/CompiledModels

      - name: Build (Debug, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EchoTune.xcodeproj \
            -scheme EchoTune \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # EchoTune exits a second instance on launch (single-instance guard). On
      # CI the test host can be spawned more than once, so the extra hosts would
      # terminate before XCTest connects and report a bootstrap failure even
      # though every test passed. Setting this to "0" makes the guard stand
      # down while still treating onboarding as completed, which is the normal
      # state a unit-test host expects.
      - name: Unit Tests (no signing)
        id: unit_tests
        env:
          ECHO_UI_TEST_FORCE_ONBOARDING: "0"
        run: |
          set -o pipefail
          xcodebuild test \
            -project EchoTune.xcodeproj \
            -scheme EchoTune \
            -destination 'platform=macOS' \
            -only-testing:EchoTuneTests \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -resultBundlePath "$RUNNER_TEMP/EchoTuneTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # xcodebuild can exit non-zero on a runner-only host bootstrap failure
      # even when every test passed. Print the machine-readable verdict so a red
      # job always says which of the two it was.
      - name: Test result summary
        if: always()
        run: |
          RESULT="$RUNNER_TEMP/EchoTuneTests.xcresult"
          if [ ! -d "$RESULT" ]; then echo "no result bundle"; exit 0; fi
          xcrun xcresulttool get test-results summary --path "$RESULT" || true
          echo '--- failing tests ---'
          xcrun xcresulttool get test-results tests --path "$RESULT" \
            | grep -E '"testName"|"result"|failureText' | head -60 || true

      - name: Crash reports
        if: always()
        run: |
          shopt -s nullglob
          for f in "$HOME"/Library/Logs/DiagnosticReports/EchoTune*.ips; do
            echo "===== $f ====="
            head -c 4000 "$f"
            echo
          done