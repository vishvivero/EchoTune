<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(145deg, #0a0e1a 0%, #0f1629 40%, #131d3a 100%);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Subtle grid pattern */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(126,208,236,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(126,208,236,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Glow orb top-right */
  .glow-1 {
    position: absolute;
    top: -120px;
    right: -80px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(126,208,236,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Glow orb bottom-left */
  .glow-2 {
    position: absolute;
    bottom: -100px;
    left: -60px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(100,180,255,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
  }

  /* App icon */
  .icon-wrap {
    width: 140px;
    height: 140px;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(126,208,236,0.2), 0 0 0 1px rgba(126,208,236,0.1);
    margin-bottom: 44px;
  }
  .icon-wrap img {
    width: 100%;
    height: 100%;
  }

  /* App name */
  h1 {
    font-size: 72px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }
  h1 span {
    background: linear-gradient(135deg, #7ed0ec, #5bb8d8, #a0e0f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Tagline */
  .tagline {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    margin-bottom: 56px;
    text-align: center;
    line-height: 1.4;
  }

  /* Feature pills */
  .features {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 56px;
  }
  .pill {
    background: rgba(126,208,236,0.08);
    border: 1px solid rgba(126,208,236,0.2);
    border-radius: 100px;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pill .emoji {
    font-size: 22px;
  }

  /* Waveform visualization */
  .waveform {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 56px;
  }
  .bar {
    width: 8px;
    border-radius: 4px;
    background: linear-gradient(to top, #7ed0ec, #5bb8d8);
    opacity: 0.6;
  }

  /* Bottom CTA area */
  .bottom {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .badge {
    font-size: 18px;
    font-weight: 700;
    color: #0a0e1a;
    background: linear-gradient(135deg, #7ed0ec, #a0e0f0);
    padding: 16px 36px;
    border-radius: 14px;
    letter-spacing: 0.5px;
  }
  .url {
    font-size: 20px;
    font-weight: 600;
    color: rgba(126,208,236,0.6);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="container">
    <div class="icon-wrap">
      <img src="EchoTune/Assets.xcassets/AppIcon.appiconset/512-mac.png" />
    </div>
    <h1><span>EchoTune</span></h1>
    <p class="tagline">AI Voice to Text for Mac<br>Speak naturally. Get perfect text.</p>

    <!-- Waveform -->
    <div class="waveform">
      <div class="bar" style="height:20px"></div>
      <div class="bar" style="height:35px"></div>
      <div class="bar" style="height:55px"></div>
      <div class="bar" style="height:40px"></div>
      <div class="bar" style="height:70px"></div>
      <div class="bar" style="height:50px"></div>
      <div class="bar" style="height:80px"></div>
      <div class="bar" style="height:60px"></div>
      <div class="bar" style="height:45px"></div>
      <div class="bar" style="height:75px"></div>
      <div class="bar" style="height:55px"></div>
      <div class="bar" style="height:85px"></div>
      <div class="bar" style="height:65px"></div>
      <div class="bar" style="height:50px"></div>
      <div class="bar" style="height:80px"></div>
      <div class="bar" style="height:60px"></div>
      <div class="bar" style="height:40px"></div>
      <div class="bar" style="height:70px"></div>
      <div class="bar" style="height:55px"></div>
      <div class="bar" style="height:35px"></div>
      <div class="bar" style="height:20px"></div>
    </div>

    <div class="features">
      <div class="pill"><span class="emoji">🔒</span> 100% Local Processing</div>
      <div class="pill"><span class="emoji">🌍</span> 99+ Languages</div>
      <div class="pill"><span class="emoji">⚡</span> Works Anywhere on Mac</div>
    </div>

    <div class="bottom">
      <div class="badge">Available Now for macOS</div>
    </div>
    <p class="url" style="margin-top: 20px;">echotune.app</p>
  </div>
</body>
</html>
